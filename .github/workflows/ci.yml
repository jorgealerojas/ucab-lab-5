name: validate-lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python -m pip install cfn-lint
      - name: Run all checks
        run: make ci
